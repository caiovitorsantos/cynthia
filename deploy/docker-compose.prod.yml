# Production on a single VPS: Caddy (automatic TLS) in front of Rails; Sidekiq, the WhatsApp service,
# Postgres and Redis stay on the internal network. Only Caddy publishes ports.
# Images come from the registry (GHCR) pinned by digest (G10): `deploy.sh <rails@sha256:...> <wa@sha256:...>` does the
# rollout and the rollback. Third-party images are pinned by digest too; Dependabot (docker-compose) proposes updates.
name: cynthia

services:
  caddy:
    image: caddy:2@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      rails:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  rails:
    image: ${IMAGE_RAILS:?}
    restart: unless-stopped
    env_file: .env
    environment:
      # Rails 8 uses three databases in production (primary, cache, cable): `DATABASE_URL` only reaches the
      # primary one, the others have their own variable. `db:prepare` creates the missing ones on boot.
      DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia
      CACHE_DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia_cache
      CABLE_DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia_cable
      REDIS_URL: redis://redis:6379/0
      WA_SERVICE_URL: http://wa:3001
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:80/up']
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    logging: *logging

  sidekiq:
    image: ${IMAGE_RAILS:?}
    command: ['bundle', 'exec', 'sidekiq']
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia
      CACHE_DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia_cache
      CABLE_DATABASE_URL: postgres://cynthia:${POSTGRES_PASSWORD:?}@db:5432/cynthia_cable
      REDIS_URL: redis://redis:6379/0
      WA_SERVICE_URL: http://wa:3001
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *logging

  wa:
    image: ${IMAGE_WA:?}
    restart: unless-stopped
    # Only what it uses (T7): no Anthropic key, admin password or master key here.
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      RAILS_WEBHOOK_URL: http://rails:80/webhooks/whatsapp
    volumes:
      # The WhatsApp session: lose it and the number has to be paired again. It is backed up (backup.sh).
      - wa_auth:/app/auth
    logging: *logging

  db:
    image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    restart: unless-stopped
    environment:
      POSTGRES_USER: cynthia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cynthia
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cynthia -d cynthia']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  db_data:
  redis_data:
  wa_auth:
