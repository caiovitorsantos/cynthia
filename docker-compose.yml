services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_scheduler_development
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rails:
    build:
      context: ./rails-app
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      WA_SERVICE_URL: http://wa:3001
    ports:
      - "3000:3000"
    volumes:
      - ./rails-app:/rails
      - rails_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa:
        condition: service_started

  wa:
    build:
      context: ./wa-service
    env_file: .env
    restart: unless-stopped
    environment:
      RAILS_WEBHOOK_URL: http://rails:3000/webhooks/whatsapp
    volumes:
      - ./wa-service:/app
      - /app/node_modules
      - wa_auth:/app/auth

  sidekiq:
    build:
      context: ./rails-app
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    restart: unless-stopped
    env_file: .env
    environment:
      WA_SERVICE_URL: http://wa:3001
    volumes:
      - ./rails-app:/rails
      - rails_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa:
        condition: service_started

volumes:
  db_data:
  redis_data:
  rails_bundle:
  wa_auth:
