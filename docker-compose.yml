services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_scheduler_development
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rails:
    build:
      context: ./rails-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      WA_SERVICE_URL: http://wa:3001
    # Só no loopback (T14/TM-17): o Rails de dev não fica exposto na rede local.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./rails-app:/rails
      - rails_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa:
        condition: service_started

  wa:
    build:
      context: ./wa-service
    restart: unless-stopped
    # Só o que o wa-service usa (T7): sem chave da Anthropic, senha do admin nem master key.
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      RAILS_WEBHOOK_URL: http://rails:3000/webhooks/whatsapp
    volumes:
      - ./wa-service:/app
      - /app/node_modules
      - wa_auth:/app/auth

  sidekiq:
    build:
      context: ./rails-app
      dockerfile: Dockerfile.dev
    command: bundle exec sidekiq
    restart: unless-stopped
    env_file: .env
    environment:
      WA_SERVICE_URL: http://wa:3001
    volumes:
      - ./rails-app:/rails
      - rails_bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa:
        condition: service_started

volumes:
  db_data:
  redis_data:
  rails_bundle:
  wa_auth:
