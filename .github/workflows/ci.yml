name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# O monorepo tem dois apps; o GitHub só lê workflows da raiz.
jobs:
  rails_scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails-app
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails-app
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager
      - name: bundler-audit
        run: bin/bundler-audit
      - name: importmap audit
        run: bin/importmap audit

  rails_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails-app
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails-app
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github

  rails_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rails_app_test
    defaults:
      run:
        working-directory: rails-app
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails-app
          bundler-cache: true
      - name: Prepara o banco
        run: bin/rails db:prepare
      - name: RSpec
        run: bin/rspec

  wa_service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wa-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=high
