# Build once, deploy the same images: CI green on main -> images in GHCR (tag = commit) -> approval in the
# `production` environment -> rollout on the VPS (deploy/deploy.sh, with automatic rollback) -> smoke test.
# Rollback or redeploy of an older version: Actions > Deploy > Run workflow, with the image tag.
#
# One-time setup (see deploy/RUNBOOK.md): environment `production` with a required reviewer, its secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and the variable DOMAIN.
name: Deploy

# Security: `workflow_run` runs with this repository's permissions, and `branches: [main]` also matches a pull request
# from a fork whose branch is called `main`. The condition below only builds a push to `main` of this very repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (empty = build and deploy the current main)
        required: false
        default: ''

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve the commit and the tag
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "sha=$SHA"
            echo "tag=${SHA:0:12}"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rails image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: rails-app
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-rails:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=rails
          cache-to: type=gha,scope=rails,mode=max
      - name: WhatsApp service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: wa-service
          file: wa-service/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-wa:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=wa
          cache-to: type=gha,scope=wa,mode=max

  deploy:
    needs: build
    # Runs after a successful build, or alone when an existing tag is given (rollback / redeploy).
    if: >-
      always() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    # The required reviewers of this environment are the human approval of the production release.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.build.outputs.tag || inputs.tag }}
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "invalid image tag"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship the deploy files
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -r deploy/. "$DEPLOY_USER@$DEPLOY_HOST:cynthia/"
      - name: Registry login on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin"
      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd cynthia && chmod +x deploy.sh backup.sh && IMAGE_RAILS=ghcr.io/${OWNER,,}/cynthia-rails IMAGE_WA=ghcr.io/${OWNER,,}/cynthia-wa ./deploy.sh '$TAG'"
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$DOMAIN/up"
