# Build once, deploy the same images: the owner clicks Run workflow on main (that click is the human approval) ->
# CI green for that commit -> trivy -> images in GHCR (tag = commit, for people) -> rollout on the VPS by digest
# (deploy/deploy.sh, with automatic rollback) -> smoke test. The deploy never uses a tag (G10): the digest comes from the push of the scanned image.
# Rollback or redeploy of an older version: Actions > Deploy > Run workflow, with the two digests (they are in the
# summary of the build that published them and in ~/cynthia/.deploy/ on the server).
#
# Accepted deviation (ADR-010): no staging and no OIDC. There is no cloud account; GHCR uses GITHUB_TOKEN and the
# VPS is reached by an SSH key kept as a GitHub secret.
# Manual deploy only (ADR-010, revision 2026-11-15): a private repository on GitHub Free has no required reviewers in
# environments, so nothing deploys by itself; only someone with write access (the owner) can run this workflow.
#
# One-time setup (see deploy/RUNBOOK.md): secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and the
# variable DOMAIN (in the `production` environment when the plan allows it, otherwise in the repository).
name: Deploy

# Security: a run only deploys when started from `main` (T22): the deploy files, deploy.sh and this workflow then
# come from the reviewed branch, never from a feature branch. No `workflow_run` trigger: a merge never deploys alone.

on:
  workflow_dispatch:
    inputs:
      rails_digest:
        description: Digest (sha256:...) of the cynthia-rails image to deploy (empty = build and deploy the current main)
        required: false
        default: ''
      wa_digest:
        description: Digest (sha256:...) of the cynthia-wa image of the same release (required with rails_digest)
        required: false
        default: ''

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.rails_digest == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read # to check that CI passed on this commit
    outputs:
      rails_image: ${{ steps.push.outputs.rails_image }}
      wa_image: ${{ steps.push.outputs.wa_image }}
    steps:
      - name: Resolve the commit and the tag
        id: meta
        env:
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "sha=$SHA"
            echo "tag=${SHA:0:12}"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
      # Replaces the old workflow_run gate: never build a commit whose CI (push on main) did not pass.
      - name: CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          c="$(gh run list -R "$GITHUB_REPOSITORY" -w CI -c "$SHA" -e push -L 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$c" == success ]] || { echo "CI on $SHA is '${c:-not run}', not success: merge, wait for CI, run again"; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rails image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rails-app
          load: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-rails:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=rails
          cache-to: type=gha,scope=rails,mode=max
      - name: WhatsApp service image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: wa-service
          file: wa-service/Dockerfile.prod
          load: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-wa:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=wa
          cache-to: type=gha,scope=wa,mode=max
      # S-03 (WHA-18): HIGH/CRITICAL com correção disponível barra o deploy antes de a imagem ir ao registro.
      - name: Trivy (Rails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-rails:${{ steps.meta.outputs.tag }}
          scanners: vuln # o scanner de segredos acusa falso positivo nos docs da gem anthropic
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy (WhatsApp service)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.owner }}/cynthia-wa:${{ steps.meta.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # The digest of the push is the content the trivy just scanned; the deploy gets that, not the tag.
      - name: Push the scanned images
        id: push
        env:
          IMAGE_PREFIX: ghcr.io/${{ steps.meta.outputs.owner }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for app in rails wa; do
            docker push "$IMAGE_PREFIX/cynthia-$app:$TAG"
            # RepoDigests can list other repos (containerd store): take the one of the repo just pushed.
            ref="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_PREFIX/cynthia-$app:$TAG" \
              | grep -m1 "^$IMAGE_PREFIX/cynthia-$app@sha256:" || true)"
            [[ "$ref" =~ ^ghcr\.io/[a-z0-9._-]+/cynthia-$app@sha256:[0-9a-f]{64}$ ]] || { echo "no digest for cynthia-$app: '$ref'"; exit 1; }
            echo "${app}_image=$ref" >> "$GITHUB_OUTPUT"
            echo "- \`$ref\` (tag \`$TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: build
    # Runs after a successful build, or alone when existing digests are given (rollback / redeploy).
    if: >-
      always() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.rails_digest != ''))
    runs-on: ubuntu-latest
    # Only a record in GitHub > Deployments: there are no required reviewers (private repo on GitHub Free). The
    # human approval is the manual Run workflow (ADR-010, revision 2026-11-15).
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      BUILT_RAILS: ${{ needs.build.outputs.rails_image }}
      BUILT_WA: ${{ needs.build.outputs.wa_image }}
      INPUT_RAILS: ${{ inputs.rails_digest }}
      INPUT_WA: ${{ inputs.wa_digest }}
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - name: Resolve the release (images by digest)
        run: |
          if [[ -n "$BUILT_RAILS" ]]; then
            rails="$BUILT_RAILS" wa="$BUILT_WA"
          else
            rails="ghcr.io/${OWNER,,}/cynthia-rails@$INPUT_RAILS" wa="ghcr.io/${OWNER,,}/cynthia-wa@$INPUT_WA"
          fi
          for ref in "$rails" "$wa"; do
            [[ "$ref" =~ ^ghcr\.io/[a-z0-9._-]+/cynthia-(rails|wa)@sha256:[0-9a-f]{64}$ ]] || { echo "invalid image: '$ref'"; exit 1; }
          done
          { echo "RAILS_IMAGE=$rails"; echo "WA_IMAGE=$wa"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship the deploy files
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -r deploy/. "$DEPLOY_USER@$DEPLOY_HOST:cynthia/"
      - name: Registry login on the server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin"
      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd cynthia && chmod +x deploy.sh backup.sh && ./deploy.sh '$RAILS_IMAGE' '$WA_IMAGE'"
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$DOMAIN/up"
