# Dependabot DESLIGADO. O GitHub só lê `.github/dependabot.yml`; com o arquivo neste nome, não há PRs automáticos
# nem execuções "Dependabot Updates" no Actions. Atualize as dependências quando decidir (bundle update, npm update)
# e rode o CI no seu próprio PR.
#
# Para religar: renomeie para `dependabot.yml` (tudo) ou copie para lá só os ecossistemas que quiser.
# `open-pull-requests-limit` controla quantos PRs abertos cada ecossistema pode ter (0 = nenhum, 5 = padrão do GitHub).
# Os alertas de segurança (aba Security) não dependem deste arquivo.
# Mantém dependências, actions (fixadas por SHA) e imagens base atualizadas com PRs semanais.
# Os PRs passam pelo CI (brakeman, bundler-audit, npm audit, testes) antes do merge.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /rails-app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      bundler-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /wa-service
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: [/rails-app, /wa-service]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  # S-08: postgres, redis e caddy do Compose de produção, fixados por digest. Major fica de fora: postgres 16 -> 17
  # exige dump/restore do volume e redis/caddy major mudam config; isso é decisão de manutenção, não PR semanal.
  - package-ecosystem: docker-compose
    directories: [/deploy]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
